{% extends "base.html" %}
{% block content %}
<div class="toolbar integration-actions">
  <button type="button" class="btn btn-primary" id="btn-bitrix">Синхронизация Bitrix24</button>
  <button type="button" class="btn btn-secondary" id="btn-onec">Выгрузка из 1С</button>
  <label class="btn btn-ghost file-btn">
    Импорт Excel
    <input type="file" id="excel-file" accept=".xlsx,.xls" hidden />
  </label>
  <button type="button" class="btn btn-ghost" id="btn-refresh">Обновить журналы</button>
</div>

<article class="panel table-panel">
  <h2 class="panel-title">Журнал интеграций</h2>
  <div class="table-wrap">
    <table class="data-table" id="logs-table">
      <thead>
        <tr><th>ID</th><th>Система</th><th>Операция</th><th>Статус</th><th>Сообщение</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</article>

<article class="panel table-panel">
  <h2 class="panel-title">История синхронизаций</h2>
  <div class="table-wrap">
    <table class="data-table" id="sync-table">
      <thead>
        <tr><th>ID</th><th>Источник</th><th>Обработано</th><th>Начало</th><th>Окончание</th><th>Статус</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</article>
{% endblock %}
{% block scripts %}
<script src="/static/js/integrations.js" defer></script>
{% endblock %}
